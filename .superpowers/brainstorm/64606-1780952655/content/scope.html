<h2>¿Cuántos proyectos de Jira querés monitorear?</h2>
<p class="subtitle">Esto afecta el modelo de datos y los filtros del tablero</p>

<div class="options">
  <div class="option" data-choice="uno" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Un solo proyecto / board</h3>
      <p>El tablero está enfocado en un equipo y su board de Scrum o Kanban.</p>
    </div>
  </div>
  <div class="option" data-choice="varios" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Varios proyectos</h3>
      <p>Quiero comparar o consolidar datos de múltiples proyectos o equipos.</p>
    </div>
  </div>
</div>
